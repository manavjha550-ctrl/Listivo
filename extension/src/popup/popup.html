<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LISTIVO Companion</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: #059669;
      color: white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      background: #dcfce7;
      color: #15803d;
      margin-top: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 16px;
      background: #059669;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">L</div>
    <div>
      <div style="font-weight: bold; font-size: 14px;">LISTIVO Companion</div>
      <div style="font-size: 11px; color: #64748b;">Meesho Listing Helper</div>
    </div>
  </div>

  <div class="status-badge">● Connected to Listivo Web App</div>

  <p style="font-size: 12px; color: #475569; margin-top: 12px; line-height: 1.4;">
    Navigate to <strong>supplier.meesho.com</strong> catalog upload page to trigger template quick-fill.
  </p>

  <a href="http://localhost:3000/templates" target="_blank" class="btn">Manage Templates</a>
</body>
</html>
